# Server Configuration
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/Alacarte
spring.datasource.username=naman
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# LangChain4j Gemini Configuration (v0.35.0 - streaming not supported)
# Set your Gemini API key as an environment variable: export GEMINI_API_KEY=your-api-key
# Or set it directly here (not recommended for production)
langchain4j.google.ai.gemini.api-key=AIzaSyAW4StK3Do4jSNaiICOR6kyMacRZQPQaxQ

# LangChain4j OpenAI Configuration
langchain4j.open-ai.api-key=your-openai-api-key-here

# LLM Model Configuration
# Use OpenAI (working) or try different Gemini model names
llm.provider=openai
llm.model.name=gpt-4
llm.temperature=0.7
llm.max-tokens=2000

# Alternative Gemini options to try:
# llm.provider=gemini
# llm.model.name=gemini-1.5-flash-latest
# llm.model.name=models/gemini-1.5-flash
