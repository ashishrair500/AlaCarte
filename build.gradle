plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.alaCarte'
version = '1.0.0'

java {
    sourceCompatibility = '21'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Web
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    
    // PostgreSQL Database
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql:42.7.1'
    
    // LangChain4j for AI integration - using version 0.35.0 for compatibility
    implementation 'dev.langchain4j:langchain4j-google-ai-gemini:0.35.0'
    implementation 'dev.langchain4j:langchain4j-spring-boot-starter:0.35.0'

    implementation 'dev.langchain4j:langchain4j:0.35.0'

    // Google Generative AI Java Client
    implementation 'com.google.cloud:google-cloud-aiplatform:3.38.0'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // Google HTTP Client for API calls
    implementation 'com.google.api-client:google-api-client:2.2.0'
    
    // OkHttp for REST calls
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    
    // Jackson for JSON (included via Spring Boot starter)
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    
    // Apache PDFBox for PDF reading
    implementation 'org.apache.pdfbox:pdfbox:3.0.1'

    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation("org.springframework.boot:spring-boot-starter-security")

    // Lombok for reducing boilerplate
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'



    // Spring Boot Starter Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}



tasks.named('test') {
    useJUnitPlatform()
}

// Configure Spring Boot plugin
springBoot {
    mainClass = 'com.alaCarte.alaCarteApplication'
}
